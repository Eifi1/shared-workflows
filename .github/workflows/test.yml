name: Test

# Tests the scripts the shared actions ship: the tests-ran guard and the
# commit-message validator. Both are the last line of defence in every app's
# CI, so a change here must prove they still fail when they should.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: tests-ran guard
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: commit-message validator
        run: node --test "tests/*.test.cjs"
