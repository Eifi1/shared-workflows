name: Test

# Tests the scripts the shared actions ship: the tests-ran guard and the
# commit-message validator. Both are the last line of defence in every app's
# CI, so a change here must prove they still fail when they should.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: tests-ran guard
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: commit-message validator
        run: node --test tests/
